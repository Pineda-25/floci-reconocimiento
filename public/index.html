<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analizando archivos con AWS</title>
</head>
<body>
  <h1>Analizando archivos con AWS</h1>
  <h2>1. AWS Rekognition (Imágenes)</h2>
  <form id="uploadForm">
    <div>
      <label for="imagen">Seleccionar imagen</label>
      <input type="file" name="imagen" accept="image/*" required>
    </div>
    <button type="submit">Enviar</button>
  </form>

  <div>
    <h3>Resultados de analisis</h3>
    <ul id="listaEtiquetas"></ul>
  </div>

  <hr>

  <h2>2. AWS Textract (Documento PDF < 5MB)</h2>
  <form id="formTextract">
    <div>
      <label for="documento">Seleccionar PDF</label>
      <input type="file" id="pdfInput" name="documento" accept="application/pdf" required>
    </div>
    <button type="submit">Enviar</button>
  </form>

  <div>
    <h3>Resultados de analisis</h3>
    <ul id="listaTexto"></ul>
  </div>

  <script>
    const form = document.getElementById("uploadForm")
    const listaEtiquetas = document.getElementById("listaEtiquetas")

    form.addEventListener("submit", async(e) => {
      e.preventDefault()
      const formData = new FormData(form)
      listaEtiquetas.innerHTML = `<li>Analizando imagen con AWS...</li>`
      
      try {
        const response = await fetch('/api/analizar', {
          method: 'POST',
          body: formData
        })
        const data = await response.json()

        if(data.success){
          listaEtiquetas.innerHTML = ``
          data.labels.forEach(label => {
            const li = document.createElement("li")
            li.innerHTML = `Imagen: ${label.Name} - confianza: ${label.Confidence}`
            listaEtiquetas.appendChild(li)
          })
        } else {
          listaEtiquetas.innerHTML = `<li>${data.error}</li>`
        }
      } catch(error) {
        listaEtiquetas.innerHTML = `<li>Error de conexion</li>`
      }
    })

    const formTextract = document.getElementById("formTextract")
    const listaTexto = document.getElementById("listaTexto")
    const pdfInput = document.getElementById("pdfInput")

    formTextract.addEventListener("submit", async(e) => {
      e.preventDefault()

      // Validacion de 5MB
      const archivo = pdfInput.files[0]
      if (archivo && archivo.size > 5 * 1024 * 1024) {
        alert("El archivo debe ser menor a 5MB")
        return
      }

      const formData = new FormData(formTextract)
      listaTexto.innerHTML = `<li>Analizando documento con AWS...</li>`

      try {
        const response = await fetch('/api/analizar-documento', {
          method: 'POST',
          body: formData
        })
        const data = await response.json()

        if(data.success){
          listaTexto.innerHTML = ``
          data.blocks.forEach(block => {
            const li = document.createElement("li")
            li.innerHTML = `Documento: ${block.Text} - confianza: ${block.Confidence}%`
            listaTexto.appendChild(li)
          })
        } else {
          listaTexto.innerHTML = `<li>${data.error}</li>`
        }
      } catch(error) {
        listaTexto.innerHTML = `<li>Error de conexion</li>`
      }
    })
  </script>
</body>
</html>
