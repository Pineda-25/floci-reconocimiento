<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analizando archivos con AWS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="p-5">

  <div class="container" style="max-width: 960px;">
    <div class="has-text-centered mb-5">
      <h1 class="title main-title is-2 mb-2">Analizando archivos con AWS</h1>
      <p class="subtitle is-5">Reconocimiento visual (Rekognition) y extracción de documentos (Textract)</p>
    </div>

    <div class="columns">
      <div class="column is-6">
        <div class="box card-rekognition">
          <div class="is-flex is-justify-content-space-between is-align-items-center mb-3">
            <h2 class="title is-5 mb-0">1. AWS Rekognition</h2>
            <span class="tag tag-verde">Imágenes</span>
          </div>

          <form id="uploadForm">
            <div class="field">
              <label class="label">Seleccionar imagen:</label>
              <div class="control">
                <input class="input" type="file" name="imagen" accept="image/*" required>
              </div>
            </div>
            <button class="button btn-verde is-fullwidth mt-4" type="submit">Analizar Imagen</button>
          </form>

          <h3 class="title is-6 mt-5 mb-3">Resultados del análisis:</h3>
          <div id="listaEtiquetas"></div>
        </div>
      </div>
      <div class="column is-6">
        <div class="box card-textract">
          <div class="is-flex is-justify-content-space-between is-align-items-center mb-3">
            <h2 class="title is-5 mb-0">2. AWS Textract</h2>
            <span class="tag tag-celeste">PDF &lt; 5MB</span>
          </div>

          <form id="formTextract">
            <div class="field">
              <label class="label">Seleccionar PDF:</label>
              <div class="control">
                <input class="input" type="file" id="pdfInput" name="documento" accept="application/pdf" required>
              </div>
            </div>
            <button class="button btn-celeste is-fullwidth mt-4" type="submit">Analizar Documento</button>
          </form>

          <h3 class="title is-6 mt-5 mb-3">Resultados del análisis:</h3>
          <div id="listaTexto"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("uploadForm")
    const listaEtiquetas = document.getElementById("listaEtiquetas")

    form.addEventListener("submit", async(e) => {
      e.preventDefault()
      const formData = new FormData(form)
      listaEtiquetas.innerHTML = `<div class="notification is-light py-2"><strong>Analizando imagen con AWS...</strong></div>`

      try {
        const response = await fetch('/api/analizar', {
          method: 'POST',
          body: formData
        })
        const data = await response.json()

        if(data.success){
          listaEtiquetas.innerHTML = ``
          data.labels.forEach(label => {
            const div = document.createElement("div")
            div.className = "resultado-box verde"
            div.innerHTML = `
              <span class="resultado-texto">${label.Name}</span>
              <span class="badge-verde">${label.Confidence}%</span>
            `
            listaEtiquetas.appendChild(div)
          })
        } else {
          listaEtiquetas.innerHTML = `<div class="notification is-danger is-light py-2">${data.error}</div>`
        }
      } catch(error) {
        listaEtiquetas.innerHTML = `<div class="notification is-danger is-light py-2">Error de conexión</div>`
      }
    })

    const formTextract = document.getElementById("formTextract")
    const listaTexto = document.getElementById("listaTexto")
    const pdfInput = document.getElementById("pdfInput")

    formTextract.addEventListener("submit", async(e) => {
      e.preventDefault()

      // Validacion de 5MB
      const archivo = pdfInput.files[0]
      if (archivo && archivo.size > 5 * 1024 * 1024) {
        alert("El archivo debe ser menor a 5MB")
        return
      }

      const formData = new FormData(formTextract)
      listaTexto.innerHTML = `<div class="notification is-light py-2"><strong>Analizando documento con AWS...</strong></div>`

      try {
        const response = await fetch('/api/analizar-documento', {
          method: 'POST',
          body: formData
        })
        const data = await response.json()

        // Mostrar en la consola del navegador (F12)
        console.log("=== JSON RECIBIDO DE TEXTRACT ===")
        console.log(data)

        if(data.success){
          listaTexto.innerHTML = ``
          data.blocks.forEach(block => {
            const div = document.createElement("div")
            div.className = "resultado-box"
            div.innerHTML = `
              <span class="resultado-texto">${block.Text}</span>
              <span class="badge-verde">${block.Confidence}%</span>
            `
            listaTexto.appendChild(div)
          })
        } else {
          listaTexto.innerHTML = `<div class="notification is-danger is-light py-2">${data.error}</div>`
        }
      } catch(error) {
        listaTexto.innerHTML = `<div class="notification is-danger is-light py-2">Error de conexión</div>`
      }
    })
  </script>
</body>
</html>
